main{flex:1;display:flex;flex-direction:column;min-height:300px}.welcome{padding:22px 12px 14px;text-align:center}.orb{width:112px;height:112px;border-radius:50%;margin:3px auto 15px;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 35% 30%,#347f9d,#112e48 55%,#091b2a);border:1px solid #46dfff88;box-shadow:0 0 0 8px #39d8ff0b,0 0 42px #39d8ff25}.orb:before,.orb:after{content:"";position:absolute;inset:-8px;border:1px solid #39d8ff44;border-radius:50%;animation:pulse 3s ease-out infinite}.orb:after{animation-delay:1.5s}.orb-face{font-size:48px;filter:drop-shadow(0 0 12px #8cecff66)}@keyframes pulse{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.35);opacity:0}}.welcome h1{font-size:24px;margin:0 0 7px}.welcome p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:16px 0 8px}.quick{background:linear-gradient(145deg,#102b3e,#0a1b29);border:1px solid var(--line);border-radius:15px;padding:13px;text-align:left;color:var(--text);min-height:68px}.quick b{display:block;font-size:13px;margin-bottom:4px}.quick span{font-size:11px;color:var(--muted)}.quick .qi{font-size:19px;margin-right:7px}
#log{display:flex;flex-direction:column;gap:12px;padding:14px 2px 18px;overflow-y:auto;flex:1;min-height:180px;scroll-behavior:smooth}.message{max-width:88%;padding:12px 14px;border-radius:17px;font-size:15px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{align-self:flex-end;background:linear-gradient(135deg,#12415a,#123148);border:1px solid #28708d;border-bottom-right-radius:5px}.message.assistant{align-self:flex-start;background:#0d2231;border:1px solid #24506a;border-bottom-left-radius:5px}.message-label{font-size:10px;letter-spacing:.5px;color:var(--cyan);margin-bottom:5px;text-transform:uppercase}.message-tools{display:flex;gap:8px;margin-top:8px}.tiny-btn{border:0;background:transparent;color:var(--muted);font-size:11px;padding:3px 0}.typing{color:var(--muted);font-size:13px;padding:6px 4px}

.overlay{position:fixed;inset:0;background:#0009;z-index:20;display:none}.overlay.show{display:block}.drawer{position:absolute;right:0;top:0;bottom:0;width:min(88vw,370px);background:#091a27;border-left:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}.drawer-head{display:flex;align-items:center;justify-content:space-between}.drawer h3{margin:0;font-size:18px}.search{width:100%;background:#10283a;border:1px solid var(--line);border-radius:11px;padding:11px;color:var(--text)}.history-list{overflow:auto;display:flex;flex-direction:column;gap:7px}.history-item{display:flex;align-items:center;gap:8px;background:#0d2231;border:1px solid #1b4057;border-radius:12px;padding:10px;text-align:left;color:var(--text)}.history-item.active{border-color:var(--cyan)}.history-title{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.history-date{font-size:10px;color:var(--muted);white-space:nowrap}.history-actions{display:flex;gap:8px}.secondary-btn{background:#10283a;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:12px}.empty-history{color:var(--muted);font-size:13px;text-align:center;padding:25px 8px}.hidden{display:none!important}

<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="brand-mark">S</div><div><div class="brand-name">Saathi</div><div class="brand-sub">Your AI companion · Built by Mostafa</div></div></div>
  <div class="top-actions"><button class="icon-btn" id="newChatBtn" aria-label="New chat" title="New chat">＋</button><button class="icon-btn" id="historyBtn" aria-label="Chat history" title="Chat history">◷</button></div>
</header>
<div class="profile-line" id="who"></div>

<main>
  <section id="login"><div class="orb"><div class="orb-face">✧</div></div><h2 id="loginTitle">Welcome to Saathi</h2><p id="loginText">Your personal AI companion.<br>Sign in to start talking.</p><button class="google-btn" id="gbtn">Continue with Google</button><div class="error" id="lerr"></div></section>
  <section id="assistant" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <section class="welcome" id="welcome"><div class="orb"><div class="orb-face">✧</div></div><h1 id="greeting">Hello 👋</h1><p id="welcomeText">I'm Saathi. Talk to me or type a message below.</p>
      <div class="quick-grid" id="quickGrid"><button class="quick" data-prompt="Help me write a message in English."><b><span class="qi">✉️</span>Message Writer</b><span>Write a reply for me</span></button><button class="quick" data-prompt="Search YouTube for a movie."><b><span class="qi">▶️</span>YouTube</b><span>Find videos and music</span></button><button class="quick" data-prompt="Help me solve a problem step by step."><b><span class="qi">🧠</span>Smart Advice</b><span>Think through a problem</span></button><button class="quick" data-prompt="Translate this into Bengali, Hindi and English."><b><span class="qi">🌐</span>Translate</b><span>Understand any language</span></button></div>
    </section>
    <div id="log" aria-live="polite"></div>
    <div class="composer-wrap"><div class="composer"><textarea id="messageInput" rows="1" placeholder="Message Saathi…" aria-label="Message Saathi"></textarea><button class="mic-btn" id="mic" aria-label="Speak" title="Speak">🎙</button><button class="send-btn" id="sendBtn" aria-label="Send" title="Send">➤</button></div><div class="status" id="st"></div><div class="bottom-note">Saathi can make mistakes. Check important information.</div></div>
  </section>
</main>
</div>
<div class="overlay" id="historyOverlay"><aside class="drawer"><div class="drawer-head"><h3>Conversation History</h3><button class="icon-btn" id="closeHistory" aria-label="Close">×</button></div><input class="search" id="historySearch" placeholder="Search your conversations…"><button class="secondary-btn" id="drawerNewChat">＋ New conversation</button><div class="history-list" id="historyList"></div><button class="secondary-btn" id="clearHistory">Clear all conversations on this device</button></aside></div>
<script type="module">

 "hi-IN":{hello:"नमस्ते, {n} 👋",welcome:"मैं साथी हूँ। मुझसे बोलिए या नीचे संदेश लिखिए।",signin:"Google से जारी रखें",signout:"साइन आउट",signedas:"साइन इन:",listen:"सुन रही हूँ…",think:"सोच रही हूँ…",speak:"आवाज़ तैयार हो रही है…",busy:"AI आवाज़ व्यस्त है। फ़ोन की आवाज़ इस्तेमाल कर रही हूँ।",nomic:"कृपया माइक्रोफ़ोन की अनुमति दें।",retry:"सुन नहीं पाई। फिर कोशिश करें।",net:"कनेक्शन में समस्या है। फिर कोशिश करें।",nosr:"वॉइस के लिए Chrome बेहतर है। आप लिखकर पूछ सकते हैं।",empty:"माफ़ कीजिए, जवाब नहीं मिला।",lerr:"साइन-इन विफल: ",placeholder:"साथी को संदेश लिखें…",emptyHistory:"अभी कोई बातचीत सेव नहीं है।"},
 "bn-IN":{hello:"নমস্কার, {n} 👋",welcome:"আমি সাথী। কথা বলো অথবা নিচে লিখে পাঠাও।",signin:"Google দিয়ে চালিয়ে যাও",signout:"সাইন আউট",signedas:"সাইন ইন:",listen:"শুনছি…",think:"ভাবছি…",speak:"ভয়েস তৈরি হচ্ছে…",busy:"AI ভয়েস ব্যস্ত। ফোনের ভয়েস ব্যবহার করছি।",nomic:"মাইক্রোফোনের অনুমতি দাও।",retry:"শুনতে পারিনি। আবার চেষ্টা করো।",net:"ইন্টারনেটে সমস্যা হচ্ছে। আবার চেষ্টা করো।",nosr:"ভয়েসের জন্য Chrome ভালো। চাইলে লিখে পাঠাও।",empty:"দুঃখিত, উত্তর পাইনি।",lerr:"সাইন-ইন হয়নি: ",placeholder:"সাথীকে মেসেজ লেখো…",emptyHistory:"এখনও কোনো কথোপকথন সেভ নেই।"}
};
var $=id=>document.getElementById(id);
var sel=$("lang"),vsel=$("voice"),loginEl=$("login"),assistant=$("assistant"),who=$("who"),log=$("log"),mic=$("mic"),st=$("st"),input=$("messageInput"),sendBtn=$("sendBtn"),gbtn=$("gbtn"),lerr=$("lerr");
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var lang="en-IN",voice="Kore",rec=null,cur=null,playId=0,user=null,history=[],chats=[],currentChatId=null,isBusy=false;
try{var sl=localStorage.getItem("saathi-lang");if(sl&&T[sl])lang=sl;var sv=localStorage.getItem("saathi-voice");if(sv)voice=sv;}catch(e){}
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function firstName(){return ((user&&user.displayName)||"").split(" ")[0]||"friend";}
function storageKey(){return "saathi-chats-"+(user&&user.uid?user.uid:"guest");}
function loadChats(){try{var raw=localStorage.getItem(storageKey());chats=raw?JSON.parse(raw):[];if(!Array.isArray(chats))chats=[];}catch(e){chats=[];}currentChatId=null;history=[];renderHistory();}
function saveChats(){try{localStorage.setItem(storageKey(),JSON.stringify(chats));}catch(e){setStatus("Device storage is full. Export or delete old chats.");}}
function activeChat(){return chats.find(c=>c.id===currentChatId)||null;}
function newChat(){currentChatId=null;history=[];log.innerHTML="";$('welcome').classList.remove('hidden');input.focus();closeDrawer();setStatus("");}
function makeId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function ensureChat(firstText){if(activeChat())return activeChat();var c={id:makeId(),title:(firstText||"New conversation").slice(0,48),createdAt:Date.now(),updatedAt:Date.now(),messages:[]};chats.unshift(c);currentChatId=c.id;saveChats();return c;}
function render(){sel.value=lang;vsel.value=voice;document.documentElement.lang=lang.slice(0,2);gbtn.textContent=T[lang].signin;input.placeholder=T[lang].placeholder;if(rec)rec.lang=lang;
 if(user){loginEl.classList.add("hidden");assistant.classList.remove("hidden");who.innerHTML=escapeHtml(T[lang].signedas+" "+(user.displayName||user.email||""))+" · <a href=\"#\" id=\"signoutLink\">"+T[lang].signout+"</a>";$("greeting").textContent=T[lang].hello.replace("{n}",firstName());$("welcomeText").textContent=T[lang].welcome;var so=$("signoutLink");so.onclick=e=>{e.preventDefault();stopAudio();signOut(auth);};}
 else{loginEl.classList.remove("hidden");assistant.classList.add("hidden");who.textContent="";}
}
function setStatus(s){st.textContent=s||"";}
function addMessage(text,role,save=true){$('welcome').classList.add('hidden');var d=document.createElement('div');d.className='message '+(role==='user'?'user':'assistant');var label=document.createElement('div');label.className='message-label';label.textContent=role==='user'?'You':'Saathi';var body=document.createElement('div');body.textContent=text;d.append(label,body);if(role!=='user'){var tools=document.createElement('div');tools.className='message-tools';var copy=document.createElement('button');copy.className='tiny-btn';copy.textContent='Copy';copy.onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(text).then(()=>setStatus('Copied.')).catch(()=>setStatus('Copy is unavailable in this browser.'));var replay=document.createElement('button');replay.className='tiny-btn';replay.textContent='Speak';replay.onclick=()=>speakAI(text);tools.append(copy,replay);d.appendChild(tools);}log.appendChild(d);log.scrollTop=log.scrollHeight;
 if(save){var c=ensureChat(role==='user'?text:'New conversation');c.messages.push({role,text,at:Date.now()});c.updatedAt=Date.now();if(c.messages.length===1&&role==='user')c.title=text.slice(0,48);saveChats();renderHistory();}}
function renderChat(c){log.innerHTML='';history=[];if(!c){$('welcome').classList.remove('hidden');return;}$('welcome').classList.add('hidden');(c.messages||[]).forEach(m=>{addMessage(m.text,m.role,false);history.push({role:m.role==='assistant'?'ai':m.role,text:m.text});});history=history.slice(-10);}
function stopAudio(){playId++;try{if(cur){cur.pause();cur=null;}speechSynthesis.cancel();}catch(e){}}
function speak(t){try{var u=new SpeechSynthesisUtterance(t);u.lang=lang;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
async function getAudio(text,v){var r=await fetch(BRAIN+"?say="+encodeURIComponent(text)+"&voice="+encodeURIComponent(v),{signal:AbortSignal.timeout(40000)});if(!r.ok)throw new Error('tts');return URL.createObjectURL(await r.blob());}
function playUrl(url,id){return new Promise((resolve,reject)=>{if(id!==playId){resolve();return;}cur=new Audio(url);cur.onended=resolve;cur.onerror=()=>reject(new Error('play'));cur.play().catch(reject);});}
async function speakAI(t){if(voice==='device'){speak(t);return;}stopAudio();var id=playId;setStatus(T[lang].speak);try{var url=await getAudio(t,voice);if(id!==playId){URL.revokeObjectURL(url);return;}await playUrl(url,id);URL.revokeObjectURL(url);if(id===playId)setStatus('');}catch(e){if(id===playId){setStatus(T[lang].busy);speak(t);}}}
async function ask(q){setStatus(T[lang].think);var prior=history.slice(0,-1).slice(-10);try{var r=await fetch(BRAIN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:q,history:prior,lang:lang}),signal:AbortSignal.timeout(30000)});if(!r.ok)throw new Error('HTTP '+r.status);var d=await r.json();return d.reply||T[lang].empty;}catch(e){return T[lang].net;}}
async function sendMessage(text){var q=(text||'').trim();if(!q||isBusy||!user)return;isBusy=true;sendBtn.disabled=true;input.value='';input.style.height='auto';addMessage(q,'user');history.push({role:'user',text:q});var typing=document.createElement('div');typing.className='typing';typing.textContent=T[lang].think;log.appendChild(typing);log.scrollTop=log.scrollHeight;var a=await ask(q);typing.remove();addMessage(a,'assistant');history.push({role:'ai',text:a});history=history.slice(-10);setStatus('');isBusy=false;sendBtn.disabled=false;await speakAI(a);}
function openDrawer(){renderHistory();$('historyOverlay').classList.add('show');}
function closeDrawer(){$('historyOverlay').classList.remove('show');}
function renderHistory(){var list=$('historyList'),term=($('historySearch').value||'').toLowerCase();list.innerHTML='';var filtered=chats.filter(c=>(c.title||'').toLowerCase().includes(term)||(c.messages||[]).some(m=>(m.text||'').toLowerCase().includes(term)));if(!filtered.length){var e=document.createElement('div');e.className='empty-history';e.textContent=T[lang].emptyHistory;list.appendChild(e);return;}filtered.forEach(c=>{var b=document.createElement('button');b.className='history-item'+(c.id===currentChatId?' active':'');var title=document.createElement('span');title.className='history-title';title.textContent=c.title||'New conversation';var date=document.createElement('span');date.className='history-date';date.textContent=new Date(c.updatedAt||c.createdAt).toLocaleDateString();b.append(title,date);b.onclick=()=>{currentChatId=c.id;history=(c.messages||[]).slice(-10).map(m=>({role:m.role==='assistant'?'ai':m.role,text:m.text}));renderChat(c);closeDrawer();};list.appendChild(b);});}
sel.onchange=()=>{lang=sel.value;try{localStorage.setItem('saathi-lang',lang);}catch(e){}render();};vsel.onchange=()=>{voice=vsel.value;try{localStorage.setItem('saathi-voice',voice);}catch(e){}};
gbtn.onclick=()=>{lerr.textContent='';signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>{lerr.textContent=T[lang].lerr+(e&&e.code?e.code:e);});};
$('newChatBtn').onclick=newChat;$('historyBtn').onclick=openDrawer;$('closeHistory').onclick=closeDrawer;$('historyOverlay').onclick=e=>{if(e.target===$('historyOverlay'))closeDrawer();};$('drawerNewChat').onclick=newChat;$('historySearch').oninput=renderHistory;
$('clearHistory').onclick=()=>{if(!confirm('Delete all Saathi conversations saved on this device? This cannot be undone.'))return;chats=[];saveChats();newChat();renderHistory();};
sendBtn.onclick=()=>sendMessage(input.value);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage(input.value);}});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px';});
document.querySelectorAll('.quick').forEach(b=>b.onclick=()=>sendMessage(b.dataset.prompt));
if(!SR){mic.disabled=true;mic.title='Voice input unavailable';setStatus(T[lang].nosr);}else{rec=new SR();rec.interimResults=false;rec.maxAlternatives=1;rec.onstart=()=>{mic.classList.add('on');mic.textContent='◉';setStatus(T[lang].listen);};rec.onend=()=>{mic.classList.remove('on');mic.textContent='🎙';};rec.onerror=e=>setStatus(e.error==='not-allowed'?T[lang].nomic:T[lang].retry);rec.onresult=e=>{var t=e.results[0][0].transcript;setStatus('');sendMessage(t);};mic.onclick=()=>{try{stopAudio();rec.lang=lang;rec.start();}catch(e){setStatus(T[lang].retry);}};}
onAuthStateChanged(auth,u=>{user=u;if(u)loadChats();else{chats=[];history=[];currentChatId=null;}render();});
render();
</script>
</body>
</html>
