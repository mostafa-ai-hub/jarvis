<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saathi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#06121c">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#06121c;--panel:#0d2233;--line:#1c4660;--text:#e6f4fb;--dim:#7fa6bb;--arc:#3fd8ff}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:"Hind Siliguri","Noto Sans Bengali","Noto Sans Devanagari",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:24px 20px;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));box-sizing:border-box}
header{text-align:center}
h1{font-size:30px;font-weight:600;margin:0;color:var(--arc)}
.by{color:var(--dim);font-size:14px;margin-top:2px}
.by a{color:var(--arc);cursor:pointer;text-decoration:underline}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:15px;font-family:inherit;max-width:46vw}
#log{width:100%;max-width:480px;flex:1;overflow-y:auto;margin:16px 0;display:flex;flex-direction:column;gap:10px}
.m{padding:10px 14px;border-radius:12px;max-width:85%;line-height:1.5;font-size:17px}
.me{align-self:flex-end;background:var(--panel);border:1px solid var(--line)}
.ai{align-self:flex-start;border:1px solid var(--arc);color:var(--arc)}
.hint{color:var(--dim);font-size:16px;text-align:center;margin:auto;line-height:1.7}
#login{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.gbtn{background:#fff;color:#1f1f1f;border:none;border-radius:12px;padding:14px 22px;font-size:17px;font-family:inherit;cursor:pointer;font-weight:600}
.err{color:#ff9b9b;font-size:14px;max-width:320px;min-height:18px}
#mic{width:116px;height:116px;border-radius:50%;border:3px solid var(--arc);background:radial-gradient(circle,#0f3a52 0%,#08202f 70%);color:var(--arc);font-size:15px;font-family:inherit;cursor:pointer;box-shadow:0 0 24px #3fd8ff44}
#mic.on{background:var(--arc);color:#04202e;box-shadow:0 0 40px var(--arc)}
#st{color:var(--dim);font-size:14px;margin-top:10px;min-height:20px;text-align:center}
</style>
</head>
<body>
<header>
<h1>Saathi</h1>
<div class="by">Built by Mostafa</div>
<div class="by" id="who"></div>
<div class="row">
<select id="lang">
<option value="en-IN">English</option>
<option value="hi-IN">हिन्दी</option>
<option value="bn-IN">বাংলা</option>
</select>
<select id="voice">
<option value="Kore">Saathi (Official, Female)</option>
<option value="Aoede">Aoede (Female)</option>
<option value="Zephyr">Zephyr (Female)</option>
<option value="Puck">Puck (Male)</option>
<option value="Charon">Charon (Male)</option>
<option value="Fenrir">Fenrir (Male)</option>
<option value="device">Fast (phone voice)</option>
</select>
</div>
</header>
<div id="login"><div class="hint" id="lhint"></div><button class="gbtn" id="gbtn"></button><div class="err" id="lerr"></div></div>
<div id="log" style="display:none"><div class="hint" id="hint"></div></div>
<div id="ctl" style="display:none;text-align:center">
<button id="mic"></button>
<div id="st"></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
var fbApp = initializeApp({
  apiKey: "AIzaSyC5GyEgZLADqUh6u5pYRWG25IxsdMWbnZ0",
  authDomain: "saathi-edcce.firebaseapp.com",
  projectId: "saathi-edcce",
  storageBucket: "saathi-edcce.firebasestorage.app",
  messagingSenderId: "675544948393",
  appId: "1:675544948393:web:ece5c78947d1a7c2c613b8"
});
var auth = getAuth(fbApp);
var BRAIN = "https://jarvis-brain.ariyankhanna30405.workers.dev";
var T = {
  "en-IN": { hello: "Hello, {n} 👋<br>Tap the button and ask me anything.", welcome: "Welcome to Saathi 👋<br>Sign in to start talking.", signin: "Continue with Google", signout: "Sign out", signedas: "Signed in as", tap: "Tap & Speak", listen: "Listening…", think: "Thinking…", speak: "Preparing voice…", busy: "AI voice is busy, so I'm using the phone voice.", nomic: "Please allow the microphone.", retry: "Couldn't hear you, try again.", net: "Sorry, there is a connection problem. Please try again.", nosr: "Please open in Chrome.", empty: "Sorry, I got no answer.", lerr: "Sign-in failed: " },
  "hi-IN": { hello: "नमस्ते, {n} 👋<br>बटन दबाइए और कुछ भी पूछिए।", welcome: "साथी में आपका स्वागत है 👋<br>बात शुरू करने के लिए साइन इन करें।", signin: "Google से जारी रखें", signout: "साइन आउट", signedas: "साइन इन:", tap: "दबाइए और बोलिए", listen: "सुन रहा हूँ…", think: "सोच रहा हूँ…", speak: "आवाज़ तैयार हो रही है…", busy: "एआई आवाज़ अभी व्यस्त है, फ़ोन की आवाज़ में बोल रहा हूँ।", nomic: "कृपया माइक्रोफ़ोन की अनुमति दें।", retry: "सुन नहीं पाया, फिर से कोशिश करें।", net: "माफ़ कीजिए, कनेक्शन में समस्या है। फिर कोशिश करें।", nosr: "कृपया Chrome में खोलें।", empty: "माफ़ कीजिए, जवाब नहीं मिला।", lerr: "साइन-इन विफल: " },
  "bn-IN": { hello: "নমস্কার, {n} 👋<br>বোতাম চেপে আমাকে যেকোনো কিছু জিজ্ঞেস করো।", welcome: "সাথীতে স্বাগতম 👋<br>কথা শুরু করতে সাইন ইন করো।", signin: "Google দিয়ে চালিয়ে যাও", signout: "সাইন আউট", signedas: "সাইন ইন:", tap: "চাপো ও বলো", listen: "শুনছি…", think: "ভাবছি…", speak: "ভয়েস তৈরি হচ্ছে…", busy: "এআই ভয়েস এখন ব্যস্ত, তাই ফোনের ভয়েসে বলছি।", nomic: "মাইক্রোফোনের অনুমতি দাও।", retry: "শুনতে পারিনি, আবার চেষ্টা করো।", net: "দুঃখিত, ইন্টারনেটে সমস্যা হচ্ছে। আবার চেষ্টা করো।", nosr: "Chrome ব্রাউজারে খোলো।", empty: "দুঃখিত, উত্তর পাইনি।", lerr: "সাইন-ইন হয়নি: " }
};
var $ = function (id) { return document.getElementById(id); };
var log = $("log"), mic = $("mic"), st = $("st"), hint = $("hint"), sel = $("lang"), vsel = $("voice");
var loginEl = $("login"), lhint = $("lhint"), gbtn = $("gbtn"), lerr = $("lerr"), ctl = $("ctl"), who = $("who");
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var history = [], lang = "en-IN", voice = "Kore", rec = null, cur = null, playId = 0, user = null;
try {
  var sl = localStorage.getItem("saathi-lang"); if (sl && T[sl]) lang = sl;
  var sv = localStorage.getItem("saathi-voice"); if (sv) voice = sv;
} catch (e) {}
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function () {}); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function firstName() { return ((user && user.displayName) || "").split(" ")[0] || "friend"; }
function render() {
  sel.value = lang; vsel.value = voice; document.documentElement.lang = lang.slice(0, 2);
  mic.textContent = T[lang].tap; gbtn.textContent = T[lang].signin; lhint.innerHTML = T[lang].welcome;
  if (user) {
    loginEl.style.display = "none"; log.style.display = "flex"; ctl.style.display = "block";
    hint.innerHTML = T[lang].hello.replace("{n}", esc(firstName()));
    who.innerHTML = T[lang].signedas + " " + esc(user.displayName || user.email || "") + " · <a id=\"so\">" + T[lang].signout + "</a>";
    $("so").onclick = function () { stopAudio(); signOut(auth); };
  } else {
    loginEl.style.display = "flex"; log.style.display = "none"; ctl.style.display = "none"; who.textContent = "";
  }
  if (rec) rec.lang = lang;
}
function add(t, c) {
  var h = log.querySelector(".hint"); if (h) h.remove();
  var d = document.createElement("div"); d.className = "m " + c; d.textContent = t;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function speak(t) {
  try { var u = new SpeechSynthesisUtterance(t); u.lang = lang; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}
function stopAudio() {
  playId++;
  try { if (cur) { cur.pause(); cur = null; } speechSynthesis.cancel(); } catch (e) {}
}
async function getAudio(text, v) {
  var r = await fetch(BRAIN + "?say=" + encodeURIComponent(text) + "&voice=" + encodeURIComponent(v), { signal: AbortSignal.timeout(40000) });
  if (!r.ok) throw new Error("tts");
  return URL.createObjectURL(await r.blob());
}
function playUrl(url, id) {
  return new Promise(function (resolve, reject) {
    if (id !== playId) { resolve(); return; }
    cur = new Audio(url);
    cur.onended = function () { resolve(); };
    cur.onerror = function () { reject(new Error("play")); };
    cur.play().catch(reject);
  });
}
async function speakAI(t) {
  if (voice === "device") { speak(t); return; }
  stopAudio();
  var id = playId;
  st.textContent = T[lang].speak;
  try {
    var url = await getAudio(t, voice);
    if (id !== playId) return;
    await playUrl(url, id);
    if (id === playId) st.textContent = "";
  } catch (e) {
    if (id === playId) { st.textContent = T[lang].busy; speak(t); }
  }
}
async function ask(q) {
  st.textContent = T[lang].think;
  try {
    var r = await fetch(BRAIN, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: q, history: history, lang: lang }), signal: AbortSignal.timeout(30000) });
    var d = await r.json();
    return d.reply || T[lang].empty;
  } catch (e) { return T[lang].net; }
}
sel.onchange = function () { lang = sel.value; try { localStorage.setItem("saathi-lang", lang); } catch (e) {} render(); };
vsel.onchange = function () { voice = vsel.value; try { localStorage.setItem("saathi-voice", voice); } catch (e) {} };
gbtn.onclick = function () {
  lerr.textContent = "";
  signInWithPopup(auth, new GoogleAuthProvider()).catch(function (e) { lerr.textContent = T[lang].lerr + (e && e.code ? e.code : e); });
};
onAuthStateChanged(auth, function (u) {
  user = u; if (!u) { history = []; }
  render();
});
if (!SR) { st.textContent = T[lang].nosr; mic.disabled = true; }
else {
  rec = new SR(); rec.interimResults = false;
  rec.onstart = function () { mic.classList.add("on"); mic.textContent = T[lang].listen; st.textContent = ""; };
  rec.onend = function () { mic.classList.remove("on"); mic.textContent = T[lang].tap; };
  rec.onerror = function (e) { st.textContent = e.error === "not-allowed" ? T[lang].nomic : T[lang].retry; };
  rec.onresult = async function (e) {
    var t = e.results[0][0].transcript; add(t, "me");
    var a = await ask(t); st.textContent = "";
    add(a, "ai"); speakAI(a);
    history.push({ role: "user", text: t }); history.push({ role: "ai", text: a });
    if (history.length > 10) history = history.slice(-10);
  };
  mic.onclick = function () { try { stopAudio(); rec.lang = lang; rec.start(); } catch (e) {} };
}
render();
</script>
</body>
</html>
